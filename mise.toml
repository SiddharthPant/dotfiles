# Source of truth for what gets installed into $HOME. Run `mise tasks` to list tasks.
# Tool files are copied by setup-tool (crates/setup-tool) from the manifests listed in the root
# manifest.json; the tasks here add the install steps that are not plain file copies.

# Toolchain for the Rust helper binaries in crates/; set it up with `mise install`.
[tools]
rust = "1.98.1"

[task_templates.platform]
shell = '{% if os() == "windows" %}pwsh -NoProfile -Command{% else %}bash -e -u -o pipefail -c{% endif %}'

[tasks.install]
description = "Copy every tool's files with setup-tool, then install Vim plugins and VS Code extensions"
alias = "default"
run = [
  "setup-tool --all",
  "mise run vim",
  "mise run vscode-extensions",
]

[tasks.build]
extends = "platform"
description = "Build setup-tool in release mode and copy it to bin/ (gitignored) for the setup-tool task"
run = '''
cargo build --release -q -p setup-tool
cp target/release/setup-tool ~/.local/bin/
echo "Built and installed setup-tool to local bin"
'''
run_windows = '''
cargo build --release -q -p setup-tool
if ($LASTEXITCODE) { exit $LASTEXITCODE }
Copy-Item target/release/setup-tool.exe ./
"Built setup-tool.exe"
'''

# No usage spec, so arguments pass straight to clap and new flags work while developing them;
# see its help with `mise run setup-tool:dev -- -h`
[tasks."setup-tool:dev"]
description = "Run setup-tool from source with cargo, passing arguments through; for developing the crate"
run = "cargo run -q -p setup-tool --"

[tasks.vim]
extends = "platform"
description = "Install vim-plug and the plugins declared in the posix .vimrc"
run = '''
. scripts/dotfiles.sh
plug="$HOME/.vim/autoload/plug.vim"
if [ ! -f "$plug" ]; then
  need curl
  curl -fLo "$plug" --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
else
  printf 'ok %s\n' "$plug"
fi
need vim
vim -Nu tools/vim/posix/.vimrc -n -es +'PlugInstall --sync' +qa
'''
run_windows = '"No Vim plugins to install: _vimrc declares none"'

[tasks.vscode-extensions]
extends = "platform"
description = "Install the VS Code extensions listed in tools/vscode/<os>/extensions.txt"
run = '''
. scripts/dotfiles.sh
need code
while IFS= read -r extension; do
  case "$extension" in '' | '#'*) continue ;; esac
  code --install-extension "$extension"
done < tools/vscode/macos/extensions.txt
code --update-extensions
'''
run_windows = '''
Get-Content tools/vscode/windows/extensions.txt |
  Where-Object { $_ -and -not $_.StartsWith('#') } |
  ForEach-Object { code --install-extension $_ }
code --update-extensions
'''

[tasks.lint]
description = "Run clippy on the Rust helper crates with the workspace lints, failing on any warning"
run = "cargo clippy --workspace --all-targets -- -D warnings"
