set -g default-terminal 'tmux-256color'  # advertise modern color support to apps
set -as terminal-overrides ',xterm*:Tc'  # enable truecolor in compatible terminals
set -g set-clipboard on  # synchronize tmux and application copies through OSC 52
set -s escape-time 0  # remove the escape-key delay for faster Vim-style input
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # enable undercurl rendering for diagnostics
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # enable colored underlines for undercurl fallback
set -g history-limit 500000 # Set a very high history limit
set -ga terminal-features "*:hyperlinks" # get links working
set -g extended-keys on # required by pi to support modified Enter keys
set -g extended-keys-format csi-u # required by pi
set-option -g renumber-windows on # renumber window indexes so we don't need to
set -g allow-passthrough on  # let image protocols from nvim and CLIs reach Ghostty
set -g set-titles on  # name Ghostty tabs and the app switcher after the session and window
set -g set-titles-string '#S: #W'

# C-a stays free for the shell's start-of-line; pressing C-Space twice sends it through, e.g. for blink.cmp.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.tmux.conf  # reload config without restarting tmux
bind '"' split-window -v -c "#{pane_current_path}"  # split top and bottom in the active pane's directory
bind % split-window -h -c "#{pane_current_path}"  # split left and right in the active pane's directory
bind c new-window -c "#{pane_current_path}"  # open new windows in the active pane's directory
bind o popup -d "#{pane_current_path}" -E -w 80% -h 80%
set -g automatic-rename on
# Name windows after the running command, or the folder when the pane is just a shell.
# Claude Code runs as ~/.local/share/claude/versions/<version>, so a bare version number means claude.
set -g automatic-rename-format '#{?#{m/r:^(fish|zsh|bash|sh)$,#{pane_current_command}},#{b:pane_current_path},#{?#{m/r:^[0-9]+(\.[0-9]+)+$,#{pane_current_command}},claude,#{pane_current_command}}}'
set -g status-interval 5
set -g base-index 1  # start window numbers at 1 so labels match human counting
set -g pane-base-index 1  # start pane numbers at 1 for consistency with windows
set-window-option -g mode-keys vi  # make copy mode use vi keys because it matches your editor habits
if-shell 'test "$(uname -s)" = Darwin' \
  'set -g copy-command "/usr/bin/pbcopy"' \
  'set -g copy-command "clip.exe"'
bind -T copy-mode-vi v send-keys -X begin-selection  # start selecting text with v, like Vim visual mode
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel  # copy through OSC 52 with y

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'  # detect Vim/Neovim-like processes in the active pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"  # ignore stopped/dead panes and match the running editor process

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'  # move left in Neovim splits or tmux panes
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'  # move down in Neovim splits or tmux panes
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'  # move up in Neovim splits or tmux panes
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'  # move right in Neovim splits or tmux panes
bind -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'  # return to the previous Neovim split or tmux pane
bind -T copy-mode-vi C-h select-pane -L  # keep Ctrl-h pane navigation available from copy mode
bind -T copy-mode-vi C-j select-pane -D  # keep Ctrl-j pane navigation available from copy mode
bind -T copy-mode-vi C-k select-pane -U  # keep Ctrl-k pane navigation available from copy mode
bind -T copy-mode-vi C-l select-pane -R  # keep Ctrl-l pane navigation available from copy mode
bind -T copy-mode-vi C-\\ select-pane -l  # return to the previous pane from copy mode
bind C-l send-keys C-l  # C-l now moves panes, so prefix C-l clears the screen in shells

bind -r ^ last-window  # jump to the last window quickly, a common Vim-like shortcut

# Alt, not Shift, because prefix L is sesh last; -r lets the key repeat without the prefix.
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Alt+number picks a window without the prefix; Ghostty sends Option as Alt.
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Sessions are managed with sesh (~/.config/sesh/sesh.toml); the built-in tree stays on prefix w.
bind -N "sesh picker" s display-popup -E -w 50% -h 80% "sesh picker -i"
# sesh last still finds a session after the previous one was killed, unlike the built-in L.
bind -N "last session (via sesh)" L run-shell "sesh last"
set -g detach-on-destroy off  # closing a session moves to another instead of leaving tmux

setw -g mouse on  # enable mouse support by default for resizing, selecting, and scrolling
set -g focus-events on # enable focus events to make nvim autoread work

# Use the terminal's ANSI palette (macOS Terminal Basic on macOS).
set -g status-style 'bg=black,fg=white'
setw -g window-status-style 'fg=brightblack,bg=default'
setw -g window-status-current-style 'fg=yellow,bg=default,bold'
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'fg=white,bg=black,fill=black'
set -g display-panes-active-colour 'green'
set -g display-panes-colour 'yellow'
setw -g clock-mode-colour 'green'
setw -g mode-style 'fg=black,bg=brightwhite'
setw -g window-status-bell-style 'fg=white,bg=red'

# The session name sits on the right so the window list starts at the left edge.
set -g status-left ''
set -g status-right-length 60  # room for the prefix marker plus long sesh session names

# Show when the prefix key is active without adding date/time clutter
set -g status-right '#{?client_prefix,#[fg=brightblack] prefix #[fg=white],}[#{session_name}]'

# Plugins, via TPM. Fresh machines clone TPM and install the plugins on the first tmux start.
# The installer reads this path, which tpm would otherwise only set after the bootstrap below has run.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
# nvim is restored by default and reopens its own session; claude picks up its folder's last conversation.
set -g @resurrect-processes '"claude->claude --continue"'
# Saves through status-right, so this block must stay below the status-right setting.
set -g @continuum-restore 'on'
# continuum skips the restore while ~/tmux_no_auto_restore exists; prefix R toggles it for a clean start.
bind -N "toggle restoring sessions on the next tmux start" R run-shell 'f=~/tmux_no_auto_restore; if [ -e "$f" ]; then rm "$f"; tmux display "Sessions will be restored on the next tmux start"; else touch "$f"; tmux display "tmux will start empty until prefix R is pressed again"; fi'
set -g @continuum-save-interval '5'  # minutes; the default 15 loses too much when the server is killed
if 'test ! -d ~/.tmux/plugins/tpm' \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
