[ui]
default-command = "log"
editor = "zed -w"
# diff-editor = ["vim", "-c", "DirDiff $left $right"]
diff-editor = ["zed", "--wait", "--diff", "$left", "$right"]
diff-instructions = false

[merge-tools.vimdiff]
program = "vimdiff"
merge-args = ["$left", "$right", "$base", "-o", "$output"]
