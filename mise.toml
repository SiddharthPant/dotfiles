# Source of truth for what gets installed into $HOME. Run `mise tasks` to list tasks.
# Tool files are copied by setup-tool (Go, setup-tool/) as listed in tools/*/manifest.json;
# the tasks here add the install steps that are not plain file copies.

# Go builds setup-tool; the rest are linters run by hk. Set them up with `mise install`.
[tools]
gitleaks = "latest"
go = "1.27.3"
golangci-lint = "latest"
hk = "latest"
pkl = "latest"
shellcheck = "latest"
shellharden = "latest"
shfmt = "latest"
taplo = "latest"

[task_templates.platform]
shell = '{% if os() == "windows" %}pwsh -NoProfile -Command{% else %}bash -e -u -o pipefail -c{% endif %}'

[tasks.install]
description = "Copy every tool's files with setup-tool, then install Vim plugins and VS Code extensions"
alias = "default"
run = [
  "setup-tool install",
  "mise run vim",
  "mise run vscode-extensions",
]

[tasks.build]
extends = "platform"
description = "Build setup-tool and install it to ~/.local/bin (to the repo root as setup-tool.exe on Windows)"
run = '''
go build -trimpath -o ~/.local/bin/setup-tool ./setup-tool
echo "Built and installed setup-tool to local bin"
'''
run_windows = '''
go build -trimpath -o setup-tool.exe ./setup-tool
if ($LASTEXITCODE) { exit $LASTEXITCODE }
"Built setup-tool.exe"
'''

# No usage spec, so arguments pass straight through and new flags work while developing them;
# see its help with `mise run setup-tool:dev -- help`
[tasks."setup-tool:dev"]
description = "Run setup-tool from source, passing arguments through; for developing it"
run = "go run ./setup-tool"

[tasks.vim]
extends = "platform"
description = "Install vim-plug and the plugins declared in the posix .vimrc"
run = '''
. scripts/dotfiles.sh
plug="$HOME/.vim/autoload/plug.vim"
if [ ! -f "$plug" ]; then
  need curl
  curl -fLo "$plug" --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
else
  printf 'ok %s\n' "$plug"
fi
need vim
vim -Nu tools/vim/posix/.vimrc -n -es +'PlugInstall --sync' +qa
'''
run_windows = '"No Vim plugins to install: _vimrc declares none"'

[tasks.vscode-extensions]
extends = "platform"
description = "Install the VS Code extensions listed in tools/vscode/<os>/extensions.txt"
run = '''
. scripts/dotfiles.sh
need code
while IFS= read -r extension; do
  case "$extension" in '' | '#'*) continue ;; esac
  code --install-extension "$extension"
done < tools/vscode/macos/extensions.txt
code --update-extensions
'''
run_windows = '''
Get-Content tools/vscode/windows/extensions.txt |
  Where-Object { $_ -and -not $_.StartsWith('#') } |
  ForEach-Object { code --install-extension $_ }
code --update-extensions
'''

[tasks.lint]
description = "Run golangci-lint on setup-tool with the lints in .golangci.yml"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run setup-tool's tests"
run = "go test ./..."
