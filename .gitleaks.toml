[extend]
useDefault = true

[[allowlists]]
description = "Gitignored build output, vendored assets and local secrets"
paths = [
  '''^target[\\/]''',
  '''^old[\\/]''',
  '''^setup-tool\.exe$''',
  '''^bin[\\/]''',
  '''^dist(\.tmp)?[\\/]''',
  '''^assets[\\/]vendor[\\/]''',
  '''^\.env\.local$''',
]
